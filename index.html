bottom:-8px;

<script>

"https://i.imgur.com/vWvOoTE.gif"
];

function setRandomBackground(){
const randomBg=backgrounds[Math.floor(Math.random()*backgrounds.length)];
document.getElementById("bg").style.backgroundImage=`url(${randomBg})`;
}

let visits=localStorage.getItem("visits");

function startTypingLoop(){
const text="world wide threat";
const el=document.getElementById("typing");
let i=0,deleting=false;

function loop(){
if(!deleting){
el.textContent=text.substring(0,i++);
if(i>text.length){deleting=true;setTimeout(loop,1200);return;}
}else{
el.textContent=text.substring(0,i--);
if(i===0){deleting=false;}
}
setTimeout(loop,deleting?40:70);
}
loop();
}

// MULTI-DOT CURSOR
const dots = [];
const trailLength = 6;
for(let i=0;i<trailLength;i++){
  dots.push(document.getElementById("dot"+i));
}


let positions = [];
for(let i=0;i<trailLength;i++){
  positions.push({x:0,y:0});
}

let mouseX=0, mouseY=0;

document.addEventListener("mousemove", e=>{
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function animateDots(){
  positions.unshift({x:mouseX, y:mouseY});
  positions.pop();
  
  dots.forEach((dot,i)=>{
    const pos = positions[i];
    dot.style.left = pos.x + "px";
    dot.style.top = pos.y + "px";
  });
  
  requestAnimationFrame(animateDots);
}

animateDots();

const warning=document.getElementById("skidWarning");

function showWarning(){warning.style.display="flex";}
function closeWarning(){warning.style.display="none";}

document.addEventListener("contextmenu",function(e){e.preventDefault();showWarning();});
let pressTimer;
document.addEventListener("touchstart",function(){pressTimer=setTimeout(showWarning,600);});
document.addEventListener("touchend",function(){clearTimeout(pressTimer);});
document.addEventListener("keydown",function(e){
if(e.key==="F12"){e.preventDefault();showWarning();}
if(e.ctrlKey && e.shiftKey && e.key==="I"){e.preventDefault();showWarning();}
if(e.ctrlKey && e.shiftKey && e.key==="J"){e.preventDefault();showWarning();}
if(e.ctrlKey && e.key==="U"){e.preventDefault();showWarning();}
});
