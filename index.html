/* CANVAS TRAIL */
#trailCanvas{
position:fixed;

}

/* ENTER */
.enter{

to{transform:scale(1.2);}

/* CARD */
.card{

.profile-wrapper {
  position: relative;
  width: 135px;
  height: 135px;
  margin: 0 auto;
}

.profile-wrapper::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border-radius: 200%;
  background: conic-gradient(
      from 0deg,
      #0e0e0e,
      #ffffff,
      #888888,
      #ffffff,
      #000000,
      #ffffff,
      #000000,
      #ffffff,
     #000000
  );
  background-size: 400% 400%;
  animation: borderAnimation 4s linear infinite;
  transition: transform 0.3s ease;
  z-index: 1;
  filter: blur(8px);
}

.profile-wrapper::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: white;
  filter: blur(12px);
  z-index: 0;
}

.profile {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 2;
}

@keyframes borderAnimation {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


@keyframes borderAnimation {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* TEXT */
.username {

  background: linear-gradient(90deg, #ffffff 0%, #d9d9d9 50%, #ffffff 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: namePop 0.5s ease-out both, nameGradient 6s ease-in-out infinite;
  display: inline-block;

@keyframes namePop {

  100% { transform: scale(1); opacity: 1; }

@keyframes nameGradient {

<script>

function enterSite(){
document.querySelector(".enter").classList.add("fade");
document.getElementById("bgMusic").play().catch(()=>{});

}

const backgrounds=[
"https://i.imgur.com/uFygyqT.gif",
"https://i.imgur.com/WkRGm5F.gif",
"https://i.imgur.com/KtG0GJk.gif",
"https://i.imgur.com/B1UipWZ.gif",
"https://i.imgur.com/vWvOoTE.gif"
];

// VISITS

visits=visits?Number(visits)+1:1;
localStorage.setItem("visits",visits);
document.getElementById("visitCount").innerText=visits;

// TYPING
function startTypingLoop(){
const text="my silence screams louder than words.";
const el=document.getElementById("typing");
let i=0,deleting=false;

function loop(){
if(!deleting){
el.textContent=text.substring(0,i++);
if(i>text.length){deleting=true;setTimeout(loop,1200);return;}
}else{
el.textContent=text.substring(0,i--);
if(i===0){deleting=false;}
}
setTimeout(loop,deleting?40:70);
}
loop();
}

const canvas = document.getElementById("trailCanvas");
const ctx = canvas.getContext("2d");

let SCALE = window.devicePixelRatio || 1;

function resizeCanvas(){
canvas.width = window.innerWidth * SCALE;
canvas.height = window.innerHeight * SCALE;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let trail = [];
const maxTrail = 40;

document.addEventListener("mousemove", e=>{
trail.push({
x: e.clientX * SCALE,
y: e.clientY * SCALE,
vx: (Math.random()-0.5)*1.5,
vy: (Math.random()-0.5)*1.5,
r: Math.random()*3+1,
life: 1,
decay: 0.02
});
});

// 👉 FUNCTION MO
function drawTrail() {
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.shadowColor = 'rgba(255,255,255,0.8)';
ctx.shadowBlur = 6 * SCALE;

let active = 0;

for (const p of trail) {
if (p.life <= 0) continue;

active++;

p.x += p.vx;
p.y += p.vy;
p.vy += 0.01;

p.life -= p.decay;
p.scale = Math.max(0, p.life);

ctx.globalAlpha = p.life;
ctx.fillStyle = '#ffffff';

ctx.beginPath();
ctx.arc(p.x, p.y, p.r * p.scale, 0, Math.PI * 2);
ctx.fill();

if (active > maxTrail) break;
}

ctx.shadowBlur = 0;
ctx.globalAlpha = 1;
}

function animateTrail(){
drawTrail();
requestAnimationFrame(animateTrail);
}
animateTrail();

</script>
